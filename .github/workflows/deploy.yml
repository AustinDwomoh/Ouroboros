# =========================================
# GitHub Actions Workflow: Ouroboros CI/CD
# Deploys Discord bot via SSH + PM2
# Features:
# - Installs dependencies in existing venv
# - Restarts bot with PM2
# - Discord notifications
# =========================================
name: Ouroboros CI/CD

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # Step 1: Checkout code
      - name: Checkout code
        uses: actions/checkout@v3

      # Step 2: Deploy to server
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USER }}
          key: ${{ secrets.DO_SSH_KEY }}
          script: |
            set -euo pipefail
            cd ~/Ouroboros

            # Activate virtualenv
            source ouroboros/bin/activate

            # Pull latest code, keeping the old commit to see what changed
            OLD=$(git rev-parse HEAD)
            git pull origin main
            CHANGED=$(git diff --name-only "$OLD" HEAD)
            echo "Changed files:"; echo "${CHANGED:-  (none)}"

            # Install/upgrade dependencies only when they changed
            if echo "$CHANGED" | grep -qx 'requirements.txt'; then
              pip install --upgrade -r requirements.txt
            fi

            # Restart only what the push touched, so the bot isn't bounced for API-only changes.
            # Docs and workflow files restart nothing.
            RELEVANT=$(echo "$CHANGED" | grep -vE '(^\.github/|\.md$|^$)' || true)
            API_ONLY='^callback_server\.py$'
            BOT_ONLY='^(cogs/|views/|cmds/|client\.py$|main\.py$)'

            if [ -n "$RELEVANT" ] && echo "$RELEVANT" | grep -qvE "$BOT_ONLY"; then
              sudo systemctl restart ouroboros-callback
              echo "Restarted API"
            fi
            if [ -n "$RELEVANT" ] && echo "$RELEVANT" | grep -qvE "$API_ONLY"; then
              pm2 restart main.py --update-env
              pm2 save  # persist across reboots
              echo "Restarted bot"
            else
              echo "Bot unchanged, not restarted"
            fi

      # Step 3: Notify Discord on failure
      - name: Notify Discord on failure
        if: failure()
        run: |
          curl -H "Content-Type: application/json" \
          -d "{\"content\": \":x: Ouroboros bot deploy failed for **${{ github.repository }}** @ **${{ github.ref_name }}**\"}" \
          ${{ secrets.DISCORD_WEBHOOK }}

      # Step 4: Notify on success
      - name: Notify Discord on success
        if: success()
        run: |
          curl -H "Content-Type: application/json" \
          -d "{\"content\": \":white_check_mark: Ouroboros bot deployed successfully on **${{ github.repository }}** @ **${{ github.ref_name }}**\"}" \
          ${{ secrets.DISCORD_WEBHOOK }}
